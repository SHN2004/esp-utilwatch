<title>UtilWatch Solder Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Martian+Mono:wdth,wght@87.5,400;87.5,500&display=swap">
<style>
/* Layout: a silicone repair mat. The board floats in the middle, build steps on the left, parts on the right. */
:root {
  --mat: #10272c; --mat-2: #163239; --mat-3: #1d3e46;
  --line: rgba(196, 226, 220, .15); --line-2: rgba(196, 226, 220, .3);
  --silk: #eef3ea; --muted: #a2b8b3;
  --kapton: #f4ab3c; --kapton-ink: #201503; --kapton-wash: rgba(244, 171, 60, .13);
  --cut: #ff7d6e;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "Martian Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--mat); color: var(--silk); font: 400 14px/1.5 var(--body); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--kapton); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(310px, 356px) minmax(0, 1fr) 236px; }
.side { display: contents; }
.rail, .legend { background: var(--mat-2); min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--mat-3) transparent; }
.rail { grid-column: 1; grid-row: 1; border-right: 1px solid var(--line); padding-block: 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px; display: flex; flex-direction: column; gap: 16px; }
.legend { grid-column: 3; grid-row: 1; border-left: 1px solid var(--line); padding-block: 18px; padding-left: 14px; padding-right: max(14px, env(safe-area-inset-right, 0px)); }

.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand b { font: 800 22px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.brand span { font: 400 10px/1.3 var(--mono); color: var(--muted); text-align: right; }

.now { display: grid; gap: 12px; }
.now .count { font: 500 11px/1 var(--mono); color: var(--kapton); font-variant-numeric: tabular-nums; }
.now h1 { margin: 0; font: 800 38px/1 var(--display); text-wrap: balance; letter-spacing: .005em; }
.now p { margin: 0; max-width: 62ch; }
.warn { border-left: 3px solid var(--kapton); background: var(--kapton-wash); padding: 9px 12px; }
.warn.danger { border-color: var(--cut); background: rgba(255, 125, 110, .12); }

.rows { display: grid; gap: 1px; background: var(--line); border-block: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 9px; align-items: center; width: 100%; text-align: left; padding: 8px 6px; background: var(--mat-2); transition: background-color 120ms ease; }
.row .sw, .lrow .sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25); }
.row .where { font: 500 11px/1.4 var(--mono); display: block; }
.row .what { color: var(--muted); font-size: 12px; line-height: 1.35; display: block; }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--mat-3); } }

.nav { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.btn { padding: 11px 16px; border: 1px solid var(--line-2); font-weight: 600; border-radius: 3px; transition: transform 140ms var(--ease-out), background-color 120ms ease, opacity 120ms ease; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .35; cursor: default; transform: none; }
.btn.go { background: var(--kapton); color: var(--kapton-ink); border-color: var(--kapton); }
@media (hover: hover) and (pointer: fine) { .btn:not(.go):not(:disabled):hover { background: var(--mat-3); } .btn.go:hover { background: #ffbc55; } }

.steps { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.steps button { width: 100%; display: grid; grid-template-columns: 26px 1fr; text-align: left; padding: 7px 4px; color: var(--muted); font-size: 13px; line-height: 1.3; border-bottom: 1px solid var(--line); transition: background-color 120ms ease, color 120ms ease; }
.steps .n { font: 400 11px/1.6 var(--mono); font-variant-numeric: tabular-nums; }
.steps .done { color: var(--silk); }
.steps [aria-current="step"] { color: var(--kapton-ink); background: var(--kapton); font-weight: 600; }
@media (hover: hover) and (pointer: fine) { .steps button:not([aria-current="step"]):hover { background: var(--mat-3); color: var(--silk); } }

.legend h2 { margin: 0 0 6px; font: 500 10px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend ul { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 1px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) 28px; align-items: stretch; border-radius: 3px; transition: background-color 120ms ease; }
.lrow.sel { background: var(--kapton-wash); box-shadow: inset 0 0 0 1px var(--kapton); }
.lrow .pick { display: flex; align-items: center; gap: 8px; text-align: left; padding: 6px; font-size: 13px; line-height: 1.25; min-width: 0; }
.lrow .pick small { display: block; font: 400 10px/1.3 var(--mono); color: var(--muted); }
.lrow.later .pick { color: var(--muted); }
.lrow .eye { display: grid; place-items: center; color: var(--muted); opacity: .75; transition: opacity 120ms ease; }
.lrow .eye[aria-pressed="false"] { color: var(--cut); opacity: 1; }
.lrow svg { width: 15px; height: 15px; display: block; }
@media (hover: hover) and (pointer: fine) { .lrow:hover { background: var(--mat-3); } .lrow .eye:hover { opacity: 1; } }
.legend .tips { font-size: 12px; color: var(--muted); display: grid; gap: 5px; }
.legend kbd { font: 400 10px/1 var(--mono); border: 1px solid var(--line-2); border-radius: 3px; padding: 2px 4px; color: var(--silk); }

.stage { grid-column: 2; grid-row: 1; position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(70, 130, 130, .2), transparent 70%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 40px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 40px 100%,
    var(--mat); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.grabbing { cursor: grabbing; }
#gl.over { cursor: pointer; }
.pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pin { position: absolute; left: 0; top: 0; font: 500 10px/1 var(--mono); color: var(--kapton-ink); background: var(--kapton); padding: 3px 4px; border-radius: 2px; white-space: nowrap; will-change: transform; }

.hud { position: absolute; display: flex; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.top { top: 12px; left: 12px; right: 12px; justify-content: space-between; flex-wrap: wrap; align-items: flex-start; }
.seg { display: inline-flex; background: rgba(16, 39, 44, .82); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px; backdrop-filter: blur(6px); }
.seg button { padding: 6px 10px; font-size: 12px; font-weight: 500; line-height: 1.2; border-radius: 2px; color: var(--muted); transition: background-color 120ms ease, color 120ms ease, transform 140ms var(--ease-out); }
.seg button:active { transform: scale(.97); }
.seg button[aria-pressed="true"] { background: var(--silk); color: var(--mat); }
@media (hover: hover) and (pointer: fine) { .seg button[aria-pressed="false"]:hover { color: var(--silk); } }

.xp { left: 50%; bottom: 14px; transform: translateX(-50%); width: min(460px, calc(100% - 24px)); flex-direction: column; gap: 3px; background: rgba(16, 39, 44, .82); border: 1px solid var(--line-2); border-radius: 4px; padding: 7px 12px 8px; backdrop-filter: blur(6px); }
.xp-head { display: flex; justify-content: space-between; align-items: baseline; font: 500 10px/1.2 var(--mono); color: var(--muted); }
.xp-head label { color: var(--silk); letter-spacing: .08em; text-transform: uppercase; }
.xp-head output { font-variant-numeric: tabular-nums; }
#expand { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; cursor: ew-resize; --v: 0%; }
#expand::-webkit-slider-runnable-track { height: 8px; border-radius: 2px; border: 1px solid var(--line-2); background: linear-gradient(90deg, var(--kapton) var(--v), #0a1b1f var(--v)); }
#expand::-moz-range-track { height: 8px; border-radius: 2px; border: 1px solid var(--line-2); background: linear-gradient(90deg, var(--kapton) var(--v), #0a1b1f var(--v)); }
#expand::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 22px; margin-top: -8px; border: 1px solid #3a4246; border-radius: 3px; background: repeating-linear-gradient(90deg, #dfe3df 0 2px, #9ba3a2 2px 4px); box-shadow: 0 1px 3px rgba(0, 0, 0, .5); transition: transform 120ms var(--ease-out); }
#expand::-moz-range-thumb { width: 32px; height: 20px; border: 1px solid #3a4246; border-radius: 3px; background: repeating-linear-gradient(90deg, #dfe3df 0 2px, #9ba3a2 2px 4px); box-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
#expand:active::-webkit-slider-thumb { transform: scale(.96); }
.ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); line-height: 1.1; }

.scale { position: absolute; left: 14px; bottom: 16px; font: 400 10px/1 var(--mono); color: var(--muted); pointer-events: none; }
.scale i { display: block; height: 5px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 4px; width: 40px; }

.card { position: absolute; top: 56px; right: 12px; width: min(258px, calc(100% - 24px)); max-height: calc(100% - 150px); overflow-y: auto; background: rgba(16, 39, 44, .94); border: 1px solid var(--kapton); border-radius: 4px; padding: 11px 12px; display: grid; gap: 6px; transition: opacity 140ms ease, transform 180ms var(--ease-out); backdrop-filter: blur(6px); }
.card[data-off="true"] { opacity: 0; transform: translateY(-4px) scale(.98); pointer-events: none; visibility: hidden; }
.card h3 { margin: 0; padding-right: 22px; font: 700 21px/1.05 var(--display); }
.card p { margin: 0; font-size: 13px; line-height: 1.42; }
.card .x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; color: var(--muted); font-size: 17px; line-height: 1; }
.card ul { list-style: none; margin: 0; padding: 0; font: 400 10.5px/1.5 var(--mono); color: var(--muted); }

.tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--silk); color: var(--mat); padding: 4px 7px; border-radius: 3px; font-size: 12px; font-weight: 500; line-height: 1.25; max-width: 240px; opacity: 0; transition: opacity 120ms ease; z-index: 3; }
.tip.on { opacity: 1; }
.tip small { display: block; font: 400 10px/1.3 var(--mono); }

.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
.fail[hidden] { display: none; }

@media (max-width: 1080px) {
  .app { grid-template-columns: minmax(300px, 340px) minmax(0, 1fr); }
  .side { display: block; grid-column: 1; grid-row: 1; min-height: 0; overflow-y: auto; background: var(--mat-2); border-right: 1px solid var(--line); }
  .rail, .legend { overflow: visible; border: 0; }
  .legend { padding-inline: 18px; padding-right: 18px; border-top: 1px solid var(--line); }
  .legend ul { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .stage { grid-column: 2; }
}
@media (max-width: 720px) {
  .app { display: flex; flex-direction: column; }
  .stage { order: -1; flex: 0 0 56%; min-height: 330px; }
  .side { flex: 1 1 0; border: 0; border-top: 1px solid var(--line-2); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
  .rail { padding-inline: 16px; }
  .legend { padding-inline: 16px; }
  .brand span { display: none; }
  .now h1 { font-size: 32px; }
  .top { top: 8px; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); }
  .seg button { padding: 6px 8px; }
  .scale { display: none; }
  .xp { bottom: 8px; }
  .card { top: auto; bottom: 88px; right: max(8px, env(safe-area-inset-right, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); width: auto; max-height: 45%; }
  .tips { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .seg button, .card, #expand::-webkit-slider-thumb { transition: none; }
}
</style>

<div class="app">
  <div class="side">
    <section class="rail" aria-label="Build steps">
      <div class="brand"><b>UtilWatch solder map</b><span>one port</span></div>
      <div class="now" id="now" aria-live="polite"></div>
      <div class="nav">
        <button class="btn" id="prev" type="button">Back</button>
        <button class="btn go" id="next" type="button">Next step</button>
      </div>
      <ol class="steps" id="steps"></ol>
    </section>
    <section class="legend" aria-label="Parts and wires">
      <h2>Parts</h2><ul id="lparts"></ul>
      <h2>Wires</h2><ul id="lwires"></ul>
      <h2>Controls</h2>
      <div class="tips">
        <div>Drag to orbit. Right-drag to pan. Scroll to zoom.</div>
        <div>Hover the board to read any hole. Click a part to isolate it.</div>
        <div><kbd>←</kbd> <kbd>→</kbd> steps &nbsp; <kbd>1</kbd>–<kbd>4</kbd> views &nbsp; <kbd>E</kbd> expand &nbsp; <kbd>Esc</kbd> clear</div>
      </div>
    </section>
  </div>
  <main class="stage" id="stage">
    <canvas id="gl" role="img" aria-label="3D model of the watch on its perfboard. The build steps list the same information as text."></canvas>
    <div class="pins" id="pins"></div>
    <div class="hud top">
      <div class="seg" role="group" aria-label="What to show">
        <button type="button" id="mStep" aria-pressed="true">This step</button>
        <button type="button" id="mAll" aria-pressed="false">Finished</button>
      </div>
      <div class="seg" role="group" aria-label="Camera view" id="views">
        <button type="button" data-view="angle" aria-pressed="false">Angle</button>
        <button type="button" data-view="top" aria-pressed="false">Top</button>
        <button type="button" data-view="under" aria-pressed="false">Underside</button>
        <button type="button" data-view="side" aria-pressed="false">Side</button>
      </div>
    </div>
    <aside class="card" id="card" data-off="true" aria-live="polite">
      <button class="x" id="cardX" type="button" aria-label="Clear selection">×</button>
      <h3 id="cardT"></h3><p id="cardD"></p><ul id="cardL"></ul>
    </aside>
    <div class="hud xp">
      <div class="xp-head"><label for="expand">Expand</label><output id="xpOut" for="expand"></output></div>
      <input id="expand" type="range" min="0" max="100" step="1" value="0">
      <div class="ends"><span>Assembled</span><span>Exploded</span></div>
    </div>
    <div class="scale" aria-hidden="true"><i id="scaleBar"></i>10 mm</div>
    <div class="tip" id="tip"></div>
    <div class="fail" id="fail" hidden></div>
  </main>
</div>

<!-- Same holes as the one-port PDF. c = column from the left, r = row from 12 o'clock, seen from the top.
     "top" wires start on the OLED's own solder joint above that hole. "via" is the free hole a wire comes up through. -->
<script type="application/json" id="wiring">
[
  {"id":"w_sda","from":[6,14],"to":[5,15],"side":"top","label":"OLED SDA to GPIO19","color":"#4f93ff","links":["oled","esp"]},
  {"id":"w_scl","from":[7,14],"to":[4,15],"side":"top","label":"OLED SCL to GPIO20","color":"#b47bff","links":["oled","esp"]},
  {"id":"w_gnd","from":[8,14],"to":[2,15],"side":"top","label":"OLED GND to GND","color":"#747d82","links":["oled","esp"]},
  {"id":"w_vcc","from":[9,14],"to":[3,15],"side":"top","label":"OLED VCC to 3V3","color":"#e5484d","links":["oled","esp"]},
  {"id":"w_up","from":[16,2],"to":[9,15],"via":[11,15],"label":"Up to GPIO9","color":"#2fbf71","links":["btnUp","esp"]},
  {"id":"w_sel","from":[16,6],"to":[8,15],"via":[12,15],"label":"Select to GPIO14","color":"#46d48a","links":["btnSel","esp"]},
  {"id":"w_down","from":[16,10],"to":[6,15],"via":[13,15],"label":"Down to GPIO18","color":"#1fa35d","links":["btnDown","esp"]},
  {"id":"w_g1","from":[18,5],"to":[18,9],"label":"Up ground leg to Select ground leg","color":"#747d82","links":["btnUp","btnSel"]},
  {"id":"w_g2","from":[18,9],"to":[18,13],"label":"Select ground leg to Down ground leg","color":"#747d82","links":["btnSel","btnDown"]}
]
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const P = 2.54, COLS = 18, ROWS = 15, W = COLS * P, H = ROWS * P;
  const hx = (c) => 1.27 + P * (c - 1), hz = (r) => 1.27 + P * (r - 1);
  const WIRING = JSON.parse($("#wiring").textContent);
  const ACCENT = 0xf4ab3c, CUT = 0xff7d6e;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // How far each layer travels, in mm, at full expand.
  const LAY = { none: 0, board: 0, oled: 28, top: 13, wires: -8, kap: -4, esp: -20, posts: -13, foam: -27, cell: -34 };
  const TOP_Y = 8, BOTTOM_Y = -6.7, TOP_X = 28, BOTTOM_X = 34;  // model extents and their travel

  // A hole to solder or check. Layer says what it moves with when expanded.
  const J = (c, r, name, side = "under", layer = "board") => ({ x: hx(c), z: hz(r), y: side === "top" ? 1.62 : -0.02, name, layer, side, key: "c" + c + " r" + r });
  const PAD = (x, z, y, layer, name) => ({ x, z, y, layer, name, side: "pad" });
  const col = (r, cs, names, side) => cs.map((c, i) => J(c, r, names[i], side));

  const EXTRA = [
    { id: "w_padm", where: "c18 r13 → ESP32 B− pad", what: "Ground. Solder to the pad before fitting the ESP32", color: "#12a5b0", links: ["esp", "btnDown"], label: "Ground chain to ESP32 B− pad" },
    { id: "w_padp", where: "c18 r14 → ESP32 B+ pad", what: "Slider outer pin. Solder to the pad before fitting the ESP32", color: "#ff9538", links: ["esp", "slider"], label: "Slider outer pin to ESP32 B+ pad" },
    { id: "w_rp", where: "100k resistor → ESP32 B+ pad", what: "Shares the pad with the B+ wire. Sleeve the leg", color: "#ffbf80", links: ["esp", "divider"], label: "100k leg to ESP32 B+ pad" },
    { id: "w_rm", where: "100k resistor → ESP32 B− pad", what: "Shares the pad with the B− wire. Sleeve the leg", color: "#6fd3da", links: ["esp", "divider"], label: "100k leg to ESP32 B− pad" },
    { id: "w_sense", where: "Resistors' twisted legs → GPIO6, ESP32's wrist side", what: "Battery level: the pin sees half the battery voltage", color: "#f2d24b", links: ["esp", "divider"], label: "Resistor midpoint to GPIO6" },
    { id: "w_batm", where: "Battery − → c18 r13", what: "Check polarity with a meter", color: "#747d82", links: ["cell", "btnDown"], label: "Battery − to the ground chain" },
    { id: "w_batp", where: "Battery + → c17 r14", what: "Slider middle pin. Solder last, slider off", color: "#e5484d", links: ["cell", "slider"], label: "Battery + to slider middle pin" },
  ];
  const WIRE = {};
  const hn = (k) => `c${k[0]} r${k[1]}`;
  WIRING.forEach((w) => {
    WIRE[w.id] = Object.assign(w, {
      where: w.side === "top" ? `OLED's own c${w.from[0]} joint → ${hn(w.to)}, top side` : w.via ? `${hn(w.from)} → up through ${hn(w.via)} → ${hn(w.to)}` : `${hn(w.from)} → ${hn(w.to)}`,
      what: w.label,
    });
  });
  EXTRA.forEach((w) => (WIRE[w.id] = w));

  const R15 = ["5V", "GND", "3V3", "IO20", "IO19", "IO18", "IO15", "IO14", "IO9", "IO8"];
  const OLED_JOINT = (c, name) => PAD(hx(c), hz(14), 5.6, "oled", name);
  const STEPS = [
    {
      t: "Check the OLED", view: "top", x: 0, adds: ["board", "oled"], focus: ["oled"],
      solder: col(14, [6, 7, 8, 9], ["SDA", "SCL", "GND", "VCC"]),
      text: "Your OLED is already on the board with its header in c6–c9, row 14, at the 6 o'clock edge. Turned around, its pins now read SDA, SCL, GND, VCC from left to right.",
      note: "Compare this with the names printed on your module. If the header is in other holes, the rest of this map won't line up.",
    },
    {
      t: "Solder the buttons and slider", view: "angle", x: 0.18, adds: ["btnUp", "btnSel", "btnDown", "slider"], focus: ["btnUp", "btnSel", "btnDown", "slider"],
      solder: [
        ...[2, 6, 10].flatMap((r) => [J(16, r, "sig"), J(18, r, ""), J(16, r + 3, ""), J(18, r + 3, "GND")]),
        J(16, 14, ""), J(17, 14, "BAT+"), J(18, 14, "B+"),
      ],
      text: "Push the three buttons in from the top, with their legs in columns 16 and 18. The slider goes in c16–c18, row 14. Solder them on the underside, then trim the legs.",
      note: "The wires use diagonal legs: top-left and bottom-right on each button. Those two always switch, whichever way the button is turned. Leave c18 r1 empty and keep the joint at c18 r2 small: a post of the case lands there.",
    },
    {
      t: "Trim the pins", view: "underAngle", x: 0.62, adds: ["esp"], ghosts: ["pinCut", "oledCut"], focus: ["pinCut", "oledCut", "esp"],

  function extents(e) { return [TOP_Y + TOP_X * e, BOTTOM_Y - BOTTOM_X * e]; }
  function fitDistance(e, polar, zoom) {
    const [t, b] = extents(e), hy = (t - b) / 2 * Math.abs(Math.sin(polar));
    const r = Math.sqrt(30 * 30 + 23 * 23 + hy * hy);
    const full = Math.tan(FOV * Math.PI / 360), v = 2 * Math.atan(full * usable), h = 2 * Math.atan(full * camera.aspect);
    return r / Math.sin(Math.min(v, h) / 2) * 0.86 / zoom;
  }
  function goalTarget(e) {
    const [t, b] = extents(e), [cx, cz] = goal.look || CENTER();
    return center.set(cx, (t + b) / 2 * (goal.look ? 0.5 : 1), cz);
  }
  function currentSph() {
    const o = camera.position.clone().sub(controls.target), d = o.length();
    return { d, polar: Math.acos(Math.max(-1, Math.min(1, o.y / d))), az: Math.atan2(o.x, o.z) };
  }
  function setCam(polar, az, d, tgt) {
    controls.target.copy(tgt);
    camera.position.set(tgt.x + d * Math.sin(polar) * Math.sin(az), tgt.y + d * Math.cos(polar), tgt.z + d * Math.sin(polar) * Math.cos(az));
  }
  const easeIO = (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2);
  function goView(name, opt = {}) {
    const v = VIEWS[name] || VIEWS.angle, roomy = stage.clientWidth > 620;
    goal = { polar: v[0], az: v[1], zoom: roomy && opt.zoom || 1, look: roomy && opt.look || null, autoframe: true };
    document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
    if (reduced || opt.instant) { setCam(goal.polar, goal.az, fitDistance(eGoal, goal.polar, goal.zoom), goalTarget(eGoal)); tween = null; return; }
    const s = currentSph(); let dAz = goal.az - s.az;
    while (dAz > Math.PI) dAz -= Math.PI * 2; while (dAz < -Math.PI) dAz += Math.PI * 2;
    tween = { t: 0, dur: 0.62, p0: s.polar, a0: s.az, dAz, d0: s.d, tgt0: controls.target.clone() };
  }
  function userTookCamera() { tween = null; document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", "false")); }
  controls.addEventListener("start", () => { userTookCamera(); $("#gl").classList.add("grabbing"); });
  controls.addEventListener("end", () => $("#gl").classList.remove("grabbing"));
  const stopAuto = () => (goal.autoframe = false);
  renderer.domElement.addEventListener("wheel", stopAuto, { passive: true });
  renderer.domElement.addEventListener("touchstart", (e) => { if (e.touches.length > 1) stopAuto(); }, { passive: true });
  renderer.domElement.addEventListener("contextmenu", stopAuto);

  /* ---------- Expand ---------- */
  const ex = $("#expand");
  function showExpand(e) {
    ex.style.setProperty("--v", e * 100 + "%");
    $("#xpOut").textContent = (TOP_Y + TOP_X * e - BOTTOM_Y + BOTTOM_X * e).toFixed(0) + " mm tall";
  }
  function setExpand(e, fromUser) {
    eGoal = Math.max(0, Math.min(1, e)); if (!fromUser) ex.value = Math.round(eGoal * 100); showExpand(eGoal);
  }
  ex.addEventListener("pointerdown", () => { eDragging = true; firstSettle = false; });
  addEventListener("pointerup", () => (eDragging = false));
  ex.addEventListener("input", () => { firstSettle = false; let v = +ex.value / 100; if (v < 0.015) v = 0; if (v > 0.985) v = 1; setExpand(v, true); });

  function applyExplode(e) {
    Object.values(parts).forEach((p) => (p.group.position.y = LAY[p.layer] * e));
    joints.forEach(({ mesh, j }) => mesh.position.set(j.x, j.y + LAY[j.layer] * e, j.z));
    buildWires(e); updateLeads(e);
  }

  /* ---------- Hover and click ---------- */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let pointer = null, down = null, needPick = false;
  const stage = $("#stage"), tip = $("#tip"), gl = $("#gl");
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  const holeNames = {};
  STEPS.forEach((s) => [...(s.solder || []), ...(s.marks || [])].forEach((j) => { if (j.key && j.name) holeNames[j.key] = j.name; }));
  function pick(px, py) {
    const r = stage.getBoundingClientRect();
    ptr.set((px - r.left) / r.width * 2 - 1, -((py - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const list = pickables.filter((m) => m.parent.visible && parts[m.userData.part].a > 0.2);
    return ray.intersectObjects(list, false)[0] || null;
  }
  function holeAt(hit) {
    const c = Math.round((hit.point.x - 1.27) / P) + 1, r = Math.round((hit.point.z - 1.27) / P) + 1;
    if (c < 1 || c > COLS || r < 1 || r > ROWS) return null;
    return { key: `c${c} r${r}`, near: Math.hypot(hit.point.x - hx(c), hit.point.z - hz(r)) < 1.15 };
  }
  function showTip(hit, x, y) {
    const r = stage.getBoundingClientRect(); const id = hit.object.userData.part;
    let main = WIRE[id] ? WIRE[id].label : NAMES[id] ? NAMES[id][0] : id, sub = WIRE[id] ? WIRE[id].where : "";
    if (id === "board") { const h = holeAt(hit); if (h && h.near) { main = h.key; sub = holeNames[h.key] || "Not used"; } }
    tip.innerHTML = main + (sub ? `<small>${sub}</small>` : "");
    tip.classList.add("on");
    const w = tip.offsetWidth, tx = Math.min(x - r.left + 14, r.width - w - 8), ty = Math.max(y - r.top - 36, 8);
    tip.style.transform = `translate(${tx}px, ${ty}px)`;
  }
  gl.addEventListener("pointermove", (e) => { pointer = [e.clientX, e.clientY]; needPick = fine; });
  gl.addEventListener("pointerleave", () => { pointer = null; tip.classList.remove("on"); if (hover3D) { hover3D = null; refreshFocus(); } gl.classList.remove("over"); });
  gl.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY, performance.now()]; tip.classList.remove("on"); });
  gl.addEventListener("pointerup", (e) => {
    if (!down) return; const moved = Math.hypot(e.clientX - down[0], e.clientY - down[1]); const quick = performance.now() - down[2] < 450; down = null;
    if (moved > 5 || !quick) return;
    const hit = pick(e.clientX, e.clientY); select(hit ? (hit.object.userData.part === selected ? null : hit.object.userData.part) : null);
  });

  $("#now").addEventListener("pointerover", (e) => { const b = e.target.closest(".row"); const next = b ? b.dataset.part : null; if (next !== rowHover) { rowHover = next; refreshFocus(); } });
  $("#now").addEventListener("pointerleave", () => { rowHover = null; refreshFocus(); });
  $("#now").addEventListener("click", (e) => { const b = e.target.closest(".row"); if (b) select(selected === b.dataset.part ? null : b.dataset.part); });
  [$("#lparts"), $("#lwires")].forEach((ul) => {
    ul.addEventListener("pointerover", (e) => { const li = e.target.closest(".lrow"); const next = li && isVisible(parts[li.dataset.part]) ? li.dataset.part : null; if (next !== rowHover && fine) { rowHover = next; refreshFocus(); } });
    ul.addEventListener("pointerleave", () => { rowHover = null; refreshFocus(); });
    ul.addEventListener("click", (e) => {
      const li = e.target.closest(".lrow"); if (!li) return; const id = li.dataset.part, p = parts[id];
      if (e.target.closest(".eye")) { p.hidden = !p.hidden; if (p.hidden && selected === id) select(null); refreshFocus(); updateLeads(eNow); return; }
      if (p.hidden) { p.hidden = false; }
      if (!isVisible(p)) setStep(whenAdded[id], { keepSel: true });
      select(selected === id ? null : id);
    });
  });
  $("#cardX").addEventListener("click", () => select(null));

  function setMode(m) {
    mode = m; $("#mStep").setAttribute("aria-pressed", String(m === "step")); $("#mAll").setAttribute("aria-pressed", String(m === "all"));
    select(null); refreshFocus(); updateLeads(eNow);
  }
  $("#mStep").addEventListener("click", () => setMode("step"));
  $("#mAll").addEventListener("click", () => setMode("all"));
  $("#views").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) goView(b.dataset.view); });

  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { select(null); return; }
    if (e.target === ex && (e.key.startsWith("Arrow") || e.key === "Home" || e.key === "End")) return;
    if (e.key === "ArrowRight") setStep(cur + 1, { kb: true });
    else if (e.key === "ArrowLeft") setStep(cur - 1, { kb: true });
    else if (e.key === "e" || e.key === "E") setExpand(eGoal > 0.5 ? 0 : 1);
    else if (["1", "2", "3", "4"].includes(e.key)) goView(["angle", "top", "under", "side"][+e.key - 1]);
  });

  onStateChange = (_, opt) => {
    if (mode !== "step") { mode = "step"; $("#mStep").setAttribute("aria-pressed", "true"); $("#mAll").setAttribute("aria-pressed", "false"); }
    if (!opt.keepSel) select(null);
    const s = STEPS[cur]; firstSettle = false; setExpand(s.x); goView(s.view, { zoom: s.zoom, look: s.look }); refreshFocus(); updateLeads(eNow);
  };

  /* ---------- Size ---------- */
  function resize() {
    const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false);
    const h = Math.max(r.height, 1), topPad = $(".top").offsetHeight + 20, botPad = $(".xp").offsetHeight + 22;
    usable = Math.max(0.4, (h - topPad - botPad) / h);
    camera.aspect = r.width / h;
    camera.setViewOffset(r.width, h, 0, (botPad - topPad) / 2, r.width, h);  // centres the model in the space between the controls
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  /* ---------- Frame ---------- */
  const accentColor = new THREE.Color(ACCENT), worldPos = new THREE.Vector3(); let last = performance.now(), lastBuilt = -1, clock = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.05); last = now; clock += dt;

    const tau = firstSettle ? 0.34 : eDragging ? 0.05 : 0.15;
    eNow += (eGoal - eNow) * (reduced ? 1 : 1 - Math.exp(-dt / tau));
    if (Math.abs(eGoal - eNow) < 0.0006) { eNow = eGoal; firstSettle = false; }
    if (Math.abs(eNow - lastBuilt) > 1e-5) { applyExplode(eNow); lastBuilt = eNow; }

    const k = reduced ? 1 : 1 - Math.exp(-dt / 0.07);
    Object.values(parts).forEach((p) => {
      if (Math.abs(p.a - p.ta) < 0.002 && Math.abs(p.h - p.th) < 0.002) { if (p.a === p.ta && p.h === p.th) return; p.a = p.ta; p.h = p.th; }
      else { p.a += (p.ta - p.a) * k; p.h += (p.th - p.h) * k; }
      p.mats.forEach((m) => {
        const u = m.userData;
        m.opacity = u.base * p.a;
        const see = p.a < 0.995 || u.base < 1 || u.basic; if (m.transparent !== see) { m.transparent = see; m.needsUpdate = true; }
        m.depthWrite = !u.basic && p.a > 0.8 && u.base >= 1;
        if (u.basic) return;
        if (u.wire) { m.emissiveIntensity = u.baseEI + 0.2 * p.h; return; }
        if (p.ghost) { m.emissiveIntensity = 0.4 + 0.25 * Math.sin(clock * 5); return; }
        m.emissive.copy(u.baseEmis).lerp(accentColor, p.h); m.emissiveIntensity = u.baseEI + 0.05 * p.h;
      });
      if (p.edgeMat) { p.edgeMat.opacity = (0.2 + 0.8 * p.h) * p.a; p.edgeMat.color.setHex(p.h > 0.3 ? ACCENT : 0xeef3ea); }
    });

    if (tween) {
      tween.t = Math.min(1, tween.t + dt / tween.dur); const q = easeIO(tween.t);
      const d = tween.d0 + (fitDistance(eGoal, goal.polar, goal.zoom) - tween.d0) * q;
      const tgt = tween.tgt0.clone().lerp(goalTarget(eGoal), q);
      setCam(tween.p0 + (goal.polar - tween.p0) * q, tween.a0 + tween.dAz * q, d, tgt);
      if (tween.t >= 1) tween = null;
    } else if (goal.autoframe) {
      const s = currentSph(), want = fitDistance(eNow, s.polar, goal.zoom), g = goalTarget(eNow);
      const kk = reduced ? 1 : 1 - Math.exp(-dt / 0.12);
      controls.target.lerp(g, kk);
      const o = camera.position.clone().sub(controls.target).setLength(s.d + (want - s.d) * kk);
      camera.position.copy(controls.target).add(o);
    }
    controls.update();

    const list = activeMarks(), r = stage.getBoundingClientRect();
    list.forEach((j, i) => {
      worldPos.set(j.x, j.y + LAY[j.layer] * eNow, j.z);
      const dist = camera.position.distanceTo(worldPos);
      const base = dist * 0.0155 * (reduced ? 1 : 1 + 0.14 * Math.sin(clock * 3.2 + i * 0.5));
      rings[i].position.copy(worldPos); rings[i].scale.set(base, base, 1);
      const el = pinEls[i]; if (el.hidden) return;
      worldPos.project(camera);
      const x = (worldPos.x + 1) / 2 * r.width, y = (1 - worldPos.y) / 2 * r.height;
      const off = i % 2 ? 11 : -26;
      el.style.transform = `translate(${x - el.offsetWidth / 2}px, ${y + off}px)`;
    });

    if (needPick && pointer && !down) {
      needPick = false;
      const hit = pick(pointer[0], pointer[1]);
      const id = hit ? hit.object.userData.part : null;
      gl.classList.toggle("over", !!id);
      if (hit) showTip(hit, pointer[0], pointer[1]); else tip.classList.remove("on");
      if (id !== hover3D) { hover3D = id; refreshFocus(); }
    }

    const dd = camera.position.distanceTo(controls.target);
    $("#scaleBar").style.width = 10 * r.height / (2 * dd * Math.tan(FOV * Math.PI / 360)) + "px";
    renderer.render(scene, camera);
  }

  /* ---------- Start ---------- */
  const s0 = STEPS[cur];
  setExpand(s0.x);
  goal = { polar: VIEWS[s0.view][0], az: VIEWS[s0.view][1], zoom: stage.clientWidth > 620 && s0.zoom || 1, look: stage.clientWidth > 620 && s0.look || null, autoframe: true };
  setCam(goal.polar, goal.az, fitDistance(eNow, goal.polar, goal.zoom), goalTarget(eNow));
  document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === s0.view)));
  refreshFocus(); applyExplode(eNow); lastBuilt = eNow;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(labelGrid);
  requestAnimationFrame(frame);
})();
</script>
